# Genre label normalization (PRD §5, TASKS.md Phase 2). genre_discogs400 (§16.3)
# uses Discogs' own "Genre---Style" hierarchy as its raw label format -- e.g.
# "Blues---Boogie Woogie", "Folk, World, & Country---Flamenco". That "---" separator
# is a machine convention from the training data, not something a caption would say.
#
# THE RULE: purely mechanical, applied uniformly to all 400 labels, no per-label
# judgment calls -- "---" becomes ": ", keeping every label's full genre+style
# information (nothing collapsed or dropped, unlike a real merge). "Blues---Boogie
# Woogie" -> "Blues: Boogie Woogie". Confirmed all 400 raw labels match the single
# "Genre---Style" pattern (exactly one "---", no exceptions) before generating this
# file mechanically rather than hand-typing 400 entries.
#
# Contrast with instrument-labels.yaml: that file has real per-label judgment calls
# (keeping electric/acoustic/classical guitar distinct). This one doesn't need any --
# it is a pure formatting fix, not a taxonomy design decision.

