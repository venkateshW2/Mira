[project]
name = "mira-lab"
version = "0.1.0"
description = "Offline Python tooling for mira: model conversion, numerical parity checks, embedding experiments. Never invoked by the app, never shipped (PRD §7)."
requires-python = "==3.12.*"
dependencies = [
  "essentia-tensorflow==2.1b6.dev1389",
  "tf2onnx>=1.16",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "numpy<2",
  "soundfile>=0.12",
]

[tool.uv]
package = false
